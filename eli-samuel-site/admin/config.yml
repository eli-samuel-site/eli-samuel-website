backend:
  name: git-gateway
  branch: main

media_folder: "eli-samuel-site/images/uploads"
public_folder: "/images/uploads"

site_url: https://eli-samuel-portfolio.netlify.app
display_url: https://eli-samuel-portfolio.netlify.app
logo_url: https://eli-samuel-portfolio.netlify.app/og-cover.png

collections:
  - name: "store"
    label: "Store"
    delete: false
    files:
      - file: "eli-samuel-site/data/store.json"
        name: "items"
        label: "Store items"
        description: "Books, prints and editions shown on the store page."
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            label_singular: "item"
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - { label: "Title",  name: "title",  widget: "string" }
              - { label: "Medium / edition", name: "medium", widget: "string" }
              - { label: "Price",  name: "price",  widget: "string" }
              - { label: "Type",   name: "kind",   widget: "select", options: ["book", "print", "zine", "box set"] }
              - { label: "Photo",  name: "image",  widget: "image", required: false }
