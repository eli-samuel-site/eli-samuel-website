<title>Store — books, prints & editions | eli samuel</title>

<body data-page="store">
  <div id="chrome"></div>

  <main class="store-page">
    <div class="store-wrap">
      <div class="store-grid" id="storeGrid"></div>
    </div>
  </main>

  <div class="film-lift"></div>
  <div class="grain"></div>
  <div class="grain-dark"></div>
  <script src="nav.js"></script>
  <script>
    // Store content is edited in the CMS (/admin) and lives in data/store.json.
    // These tonal gradients are only fallbacks for items that have no photo yet.
    const grads = [
      'linear-gradient(160deg,#8a6a76,#241a20)','linear-gradient(160deg,#6a6a58,#20201a)',
      'linear-gradient(160deg,#7a5a5a,#241818)','linear-gradient(160deg,#5a6672,#181e24)',
      'linear-gradient(160deg,#8a6a52,#241a12)','linear-gradient(160deg,#6a5a6a,#201820)',
      'linear-gradient(160deg,#7a5a4a,#221610)','linear-gradient(160deg,#5a5a4a,#1a1a12)',
      'linear-gradient(160deg,#8a5a5a,#241414)','linear-gradient(160deg,#8a4a44,#240f0c)',
      'linear-gradient(160deg,#6a6658,#1e1c14)','linear-gradient(160deg,#5a5a6a,#181820)'
    ];
    const g = document.getElementById('storeGrid');
    function render(items){
      g.innerHTML = items.map((p,i)=>{
        const fill = p.image
          ? `url('${p.image}') center/cover no-repeat`
          : grads[i % grads.length];
        return `<a class="pitem" href="store-item.html">
          <div class="pimg"><span class="kind">${p.kind||'print'}</span>
            <div style="position:absolute;inset:0;background:${fill}"></div></div>
          <div class="pcap"><b></b>${p.title||''}<br>${p.medium||''}<br>
            <span class="price">${p.price||''}</span> — <span class="buy">buy →</span></div>
        </a>`;
      }).join('');
    }
    fetch('data/store.json')
      .then(r => r.json())
      .then(d => render(d.items || []))
      .catch(() => render([]));   // fail quietly if the file can't load
  </script>
</body>
